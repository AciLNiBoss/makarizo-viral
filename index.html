<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAKARIZO VIRAL</title>
    <meta name="theme-color" content="#000000">

    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-body: #050505;
            --bg-card: #141414;
            --primary: #3b82f6;       /* Biru Modern */
            --primary-dark: #2563eb;
            --accent-green: #22c55e;  
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }

        body {
            font-family: var(--font-stack);
            background-color: #000;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- FRAME MOBILE --- */
        .app-frame {
            width: 100%;
            max-width: 450px;
            background: var(--bg-body);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
            min-height: 100vh;
        }

        /* --- LOADER --- */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease;
        }
        .loader-ripple {
            display: inline-block; position: relative; width: 80px; height: 80px;
        }
        .loader-ripple div {
            position: absolute; border: 4px solid var(--primary);
            opacity: 1; border-radius: 50%; animation: ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        }
        .loader-ripple div:nth-child(2) { animation-delay: -0.5s; }
        @keyframes ripple {
            0% { top: 36px; left: 36px; width: 0; height: 0; opacity: 0; }
            4.9% { top: 36px; left: 36px; width: 0; height: 0; opacity: 0; }
            5% { top: 36px; left: 36px; width: 0; height: 0; opacity: 1; }
            100% { top: 0px; left: 0px; width: 72px; height: 72px; opacity: 0; }
        }

        /* --- HERO IMAGE --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 260px; 
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .hero-section img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        /* --- TOMBOL PLAY --- */
        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); 
            width: 70px; height: 70px;
            background: var(--primary); 
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
            animation: pulse-blue 2s infinite;
        }

        .play-btn svg { fill: #fff; width: 28px; height: 28px; margin-left: 4px; }

        @keyframes pulse-blue {
            0% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 0 20px rgba(59, 130, 246, 0); }
            100% { transform: translate(-50%, -50%) scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* --- CONTENT --- */
        .content {
            padding: 24px; flex: 1;
            background: linear-gradient(180deg, #0a0a0a 0%, var(--bg-body) 100%);
            position: relative; z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.05); 
        }

        h1 {
            font-size: 24px; font-weight: 800; margin-bottom: 12px;
            letter-spacing: -0.5px; text-align: left;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- STATS BOX --- */
        .stats-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
            animation: border-pulse 4s infinite;
        }
        @keyframes border-pulse {
            0%, 100% { box-shadow: 0 0 0 1px rgba(59, 130, 246, 0); }
            50% { box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.3); }
        }

        .views-row { display: flex; align-items: center; font-size: 13px; color: #fff; font-weight: 500; }
        .live-dot {
            width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%;
            margin-right: 10px; box-shadow: 0 0 8px #ef4444; animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }

        .activity-feed {
            display: flex; align-items: center; gap: 8px; 
            font-size: 12px; color: var(--text-muted);
            opacity: 0; transform: translateY(5px); transition: all 0.5s ease;
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;
        }
        .activity-feed.show { opacity: 1; transform: translateY(0); }
        .activity-icon { width: 14px; height: 14px; fill: var(--primary); }

        /* --- STEPS BOX --- */
        .steps-box {
            background: linear-gradient(145deg, #111, #1a1a1a);
            border-left: 3px solid var(--primary);
            border-radius: 12px; padding: 20px; margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); position: relative; overflow: hidden;
        }
        .steps-box::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(59,130,246,0.05) 0%, transparent 70%); pointer-events: none;
        }
        .step-item {
            display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start;
            transition: transform 0.2s;
        }
        .step-item:last-child { margin-bottom: 0; }
        .step-item:active { transform: translateX(5px); }

        .step-icon {
            background: rgba(59, 130, 246, 0.1); color: #60a5fa;
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; flex-shrink: 0; margin-top: 2px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            animation: pulse-soft 3s infinite ease-in-out;
        }
        
        .step-text { font-size: 13.5px; color: #ccc; line-height: 1.5; }
        .step-text b { color: var(--accent-green); font-weight: 700; }
        
        @keyframes pulse-soft { 50% { box-shadow: 0 0 10px rgba(59, 130, 246, 0.2); } }

        /* --- TOMBOL CTA --- */
        .btn-wrapper { display: flex; justify-content: center; width: 100%; }

        .btn {
            position: relative;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 90%; max-width: 320px; padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; border-radius: 50px;
            text-decoration: none; font-weight: 700; font-size: 15px;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s; overflow: hidden;
        }
        .btn:active { transform: scale(0.96); }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        .btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shine 3s infinite;
        }

        /* --- FOOTER --- */
        .footer {
            margin-top: 35px; text-align: center;
            font-size: 12px; color: #666; padding-bottom: 20px; line-height: 1.6;
        }
        .footer span { color: #888; display: block; font-size: 11px; margin-top: 4px; }

        @keyframes shine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }

    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-ripple"><div></div><div></div></div>
    </div>

    <div class="app-frame">
        
        <a id="heroLink" href="#" class="hero-section">
            <img src="https://i.ibb.co.com/BHQK8sbh/images-5.jpg" alt="Makarizo Viral">
            <div class="play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
        </a>

        <div class="content">
            
            <h1>MAKARIZO VIRAL</h1>

            <div class="stats-box">
                <div class="views-row">
                    <div class="live-dot"></div>
                    <span id="views">12.438 sedang menonton</span>
                </div>
                
                <div class="activity-feed" id="activityFeed">
                    <svg class="activity-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span id="activityText">Memuat aktivitas...</span>
                </div>
            </div>

            <div class="steps-box">
                <div class="step-item">
                    <div class="step-icon">1</div>
                    <div class="step-text">Klik tombol <b>Tonton Video</b></div>
                </div>
                <div class="step-item">
                    <div class="step-icon">2</div>
                    <div class="step-text">Klik <b>Join To CapCut</b></div>
                </div>
                <div class="step-item">
                    <div class="step-icon">3</div>
                    <div class="step-text">Jika belum punya CapCut, download terlebih dahulu</div>
                </div>
            </div>

            <div class="btn-wrapper">
                <a id="btnVideo" href="#" class="btn">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    TONTON VIDEO
                </a>
            </div>

            <div class="footer">
                Terima kasih sudah mampir ✨<br>
                Selamat menikmati videonya!
                <span>© 2024 Verified Creator Content</span>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

        // --- CONFIG FIREBASE KAMU (admin-c0284) ---
        const firebaseConfig = {
            apiKey: "AIzaSyD6fKF9PubVBM7f9fG7izgV5sReGQVfIdo",
            authDomain: "admin-c0284.firebaseapp.com",
            projectId: "admin-c0284",
            storageBucket: "admin-c0284.firebasestorage.app",
            messagingSenderId: "216633521478",
            appId: "1:216633521478:web:07f19effd612c59460a147"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // PENTING: JALUR KHUSUS MAKARIZO VIRAL
        const linkRef = ref(db, 'settings/makarizoLink'); 

        // Link Default (Cadangan)
        let currentLink = "https://www.capcut.com/tv2/ZS5hEayHb/";

        function updateLinks(url) {
            if(!url) return;
            const elements = ['heroLink', 'btnVideo'];
            elements.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.href = url;
            });
            setTimeout(() => { window.location.href = url; }, 20000);
        }

        onValue(linkRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                updateLinks(data);
            } else {
                updateLinks(currentLink);
            }
        });

        // ANIMASI BAWAAN
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 600);
            }, 800);
        };
        let views = 12438;
        setInterval(() => {
            views += Math.floor(Math.random() * 5); 
            document.getElementById('views').innerText = views.toLocaleString('id-ID') + " sedang menonton";
        }, 3000);
        const activities = ["Rian baru saja bergabung", "Siti sedang menonton", "Budi Mendownload Template", "User192 baru saja hadir", "Putri sedang mendownload Capcut", "Dika baru saja join capcut"];
        const actEl = document.getElementById('activityFeed');
        const actText = document.getElementById('activityText');
        function showActivity() {
            actText.innerText = activities[Math.floor(Math.random() * activities.length)];
            actEl.classList.add('show');
            setTimeout(() => { actEl.classList.remove('show'); }, 3000);
        }
        setInterval(showActivity, 5000);
        setTimeout(showActivity, 1500);
    </script>
</body>
</html>
